<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ardas Social Kitchen</title>
    <meta
      name="description"
      content="Ardas Social Kitchen — local Indian food. Site redesign in progress."
    />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #1a1209;
        --fg: #f5efe4;
        --accent: #d4a017;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        font-family: system-ui, sans-serif;
        background: var(--bg);
        color: var(--fg);
        text-align: center;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(1.75rem, 5vw, 2.5rem);
        font-weight: 600;
        letter-spacing: 0.02em;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        opacity: 0.85;
        max-width: 28rem;
      }
      .mark {
        color: var(--accent);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Ardas <span class="mark">Social Kitchen</span></h1>
      <p>New website coming soon.</p>
    </main>
  </body>
</html>
